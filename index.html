<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf8ef" />
    <meta name="description" content="Vincent's little corner of the internet." />
    <title>Vincent's Little Corner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260824-mobile-card-flip-v2" />
  </head>
  <body>
    <div class="page-texture" aria-hidden="true"></div>
    <header class="site-header">
      <button class="sound-toggle" type="button" aria-pressed="true">sound: on</button>
    </header>

    <main id="top">
      <section class="hero">
        <div class="web-decoration web-top" aria-hidden="true"></div>
        <div class="web-decoration web-bottom" aria-hidden="true"></div>
        <div class="hero-copy">
          <h1>Hi, I'm<br /><span>Vincent.</span></h1>
        </div>

        <div class="orbit-scene" aria-label="Vincent in a masked hood at a café">
          <div class="photo-stage">
            <button class="photo-card planet" type="button" aria-label="Make Vincent's photo pop">
            <img src="assets/vincent-spiderman-sanitized.png" alt="Vincent in a red masked hood, leaning on a café table" width="1448" height="1086" decoding="async" fetchpriority="high" />
              <span class="photo-label">secret identity: classified</span>
            </button>
            <div class="spider-launcher">
              <button class="web-button" type="button" aria-label="Help the tiny spider shoot a web" aria-busy="false">
                <span class="button-web" aria-hidden="true"></span>
                <span class="button-spider" aria-hidden="true">
                  <i class="spider-leg leg-one"></i><i class="spider-leg leg-two"></i><i class="spider-leg leg-three"></i><i class="spider-leg leg-four"></i>
                  <i class="spider-leg leg-five"></i><i class="spider-leg leg-six"></i><i class="spider-leg leg-seven"></i><i class="spider-leg leg-eight"></i>
                  <span class="spider-face"><i></i><i></i></span>
                </span>
                <span class="spider-pop" aria-hidden="true">thwip!</span>
              </button>
            </div>
          </div>
          <p class="poke">tap the hero for a picture pop</p>
        </div>
      </section>

      <section class="planet-band" id="solar-system" aria-labelledby="solar-title">
        <div class="planet-playmat" aria-hidden="true">
          <span class="playmat-orbit playmat-orbit-one"></span>
          <span class="playmat-orbit playmat-orbit-two"></span>
          <span class="playmat-ringed"></span>
          <span class="playmat-crescent"></span>
          <span class="playmat-comet"></span>
          <span class="playmat-star playmat-star-one"></span>
          <span class="playmat-star playmat-star-two"></span>
          <span class="playmat-star playmat-star-three"></span>
          <span class="playmat-star playmat-star-four"></span>
          <span class="playmat-star playmat-star-five"></span>
        </div>
        <div class="solar-map-heading">
          <p class="solar-kicker">tap a world &mdash; hear its name</p>
          <h2 id="solar-title">Our solar<br /><span>system.</span></h2>
          <p class="solar-scale">all together &middot; not to scale</p>
        </div>

        <div class="solar-map-window" role="group" aria-label="The Sun, planets, and dwarf planets arranged in outward order">
          <div class="solar-map">
              <svg class="solar-route solar-route-wide" viewBox="0 0 1000 570" preserveAspectRatio="none" aria-hidden="true">
                <path d="M100 92 H900 C948 92 948 284 900 284 H100 C52 284 52 478 100 478 H700" />
              </svg>
              <svg class="solar-route solar-route-compact" viewBox="0 0 300 710" preserveAspectRatio="none" aria-hidden="true">
                <path d="M50 68 H250 C282 68 282 211 250 211 H50 C18 211 18 354 50 354 H250 C282 354 282 497 250 497 H50 C18 497 18 640 50 640 H150" />
              </svg>

              <button class="mini-planet sun" type="button" data-planet="Sun" data-note="247" aria-label="Hear Sun say its name. The Sun is our star."><span class="planet-system" aria-hidden="true"><span class="planet-orb"></span></span><span>Sun</span></button>
              <button class="mini-planet mercury" type="button" data-planet="Mercury" data-note="262" aria-label="Hear Mercury say its name. Mercury has no moons."><span class="planet-system" aria-hidden="true"><span class="planet-orb"></span></span><span>Mercury</span></button>
              <button class="mini-planet venus" type="button" data-planet="Venus" data-note="294" aria-label="Hear Venus say its name. Venus has no moons."><span class="planet-system" aria-hidden="true"><span class="planet-orb"></span></span><span>Venus</span></button>
              <button class="mini-planet earth" type="button" data-planet="Earth" data-note="330" aria-label="Hear Earth say its name. The Moon is orbiting Earth." title="Moon"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-2"><i class="moon-dot moon-silver"></i></span><span class="planet-orb"></span></span><span>Earth</span></button>
              <button class="mini-planet mars" type="button" data-planet="Mars" data-note="349" aria-label="Hear Mars say its name. Phobos and Deimos are orbiting Mars." title="Phobos &middot; Deimos"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-1 fast"><i class="moon-dot moon-dark"></i></span><span class="moon-track orbit-4 slow"><i class="moon-dot moon-silver"></i></span><span class="planet-orb"></span></span><span>Mars</span></button>
              <button class="mini-planet ceres" type="button" data-planet="Ceres" data-note="554" aria-label="Hear Ceres say its name. Ceres is a dwarf planet in the asteroid belt and has no moons."><span class="planet-system" aria-hidden="true"><span class="planet-orb"></span></span><span>Ceres</span></button>
              <button class="mini-planet jupiter" type="button" data-planet="Jupiter" data-note="392" aria-label="Hear Jupiter say its name. Four featured Galilean moons are shown: Io, Europa, Ganymede, and Callisto." title="Featured moons: Io &middot; Europa &middot; Ganymede &middot; Callisto"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-1 fast"><i class="moon-dot moon-gold"></i></span><span class="moon-track orbit-2"><i class="moon-dot moon-cream"></i></span><span class="moon-track orbit-4 slow"><i class="moon-dot moon-silver moon-large"></i></span><span class="moon-track orbit-6 slower"><i class="moon-dot moon-dark"></i></span><span class="planet-orb"></span></span><span>Jupiter</span></button>
              <button class="mini-planet saturn" type="button" data-planet="Saturn" data-note="440" aria-label="Hear Saturn say its name. Seven featured moons are shown: Mimas, Enceladus, Tethys, Dione, Rhea, Titan, and Iapetus." title="Featured moons: Mimas &middot; Enceladus &middot; Tethys &middot; Dione &middot; Rhea &middot; Titan &middot; Iapetus"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-1 fast"><i class="moon-dot moon-silver"></i></span><span class="moon-track orbit-2"><i class="moon-dot moon-cream"></i></span><span class="moon-track orbit-3"><i class="moon-dot moon-silver"></i></span><span class="moon-track orbit-4 slow"><i class="moon-dot moon-dark"></i></span><span class="moon-track orbit-5 slow"><i class="moon-dot moon-silver moon-large"></i></span><span class="moon-track orbit-6 slower"><i class="moon-dot moon-gold moon-large"></i></span><span class="moon-track orbit-7 slower"><i class="moon-dot moon-dark"></i></span><span class="planet-orb"><i class="planet-ring"></i></span></span><span>Saturn</span></button>
              <button class="mini-planet uranus" type="button" data-planet="Uranus" data-note="494" aria-label="Hear Uranus say its name. Five major moons are shown: Miranda, Ariel, Umbriel, Titania, and Oberon." title="Major moons: Miranda &middot; Ariel &middot; Umbriel &middot; Titania &middot; Oberon"><span class="planet-system moon-plane-sideways" aria-hidden="true"><span class="moon-track orbit-1 fast"><i class="moon-dot moon-silver"></i></span><span class="moon-track orbit-2"><i class="moon-dot moon-cream"></i></span><span class="moon-track orbit-3 slow"><i class="moon-dot moon-dark"></i></span><span class="moon-track orbit-5 slow"><i class="moon-dot moon-silver moon-large"></i></span><span class="moon-track orbit-7 slower"><i class="moon-dot moon-dark"></i></span><span class="planet-orb"></span></span><span>Uranus</span></button>
              <button class="mini-planet neptune" type="button" data-planet="Neptune" data-note="523" aria-label="Hear Neptune say its name. Featured moon Triton is shown orbiting backward." title="Featured moon: Triton (retrograde orbit)"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-5 retrograde"><i class="moon-dot moon-silver moon-large"></i></span><span class="planet-orb"></span></span><span>Neptune</span></button>
              <button class="mini-planet pluto" type="button" data-planet="Pluto" data-note="587" aria-label="Hear Pluto say its name. Charon, Styx, Nix, Kerberos, and Hydra are orbiting Pluto." title="Charon &middot; Styx &middot; Nix &middot; Kerberos &middot; Hydra"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-2 fast"><i class="moon-dot moon-cream moon-charon"></i></span><span class="moon-track orbit-4"><i class="moon-dot moon-silver"></i></span><span class="moon-track orbit-5 slow"><i class="moon-dot moon-dark"></i></span><span class="moon-track orbit-6 slow"><i class="moon-dot moon-silver"></i></span><span class="moon-track orbit-7 slower"><i class="moon-dot moon-cream"></i></span><span class="planet-orb"></span></span><span>Pluto</span></button>
              <button class="mini-planet haumea" type="button" data-planet="Haumea" data-note="622" aria-label="Hear Haumea say its name. Namaka and Hiʻiaka are orbiting Haumea." title="Namaka &middot; Hi&#x02BB;iaka"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-2 fast"><i class="moon-dot moon-silver"></i></span><span class="moon-track orbit-6 slow"><i class="moon-dot moon-cream moon-large"></i></span><span class="planet-orb"><i class="dwarf-ring"></i></span></span><span>Haumea</span></button>
              <button class="mini-planet makemake" type="button" data-planet="Makemake" data-note="659" aria-label="Hear Makemake say its name. Its provisional moon MK 2 is orbiting." title="Provisional moon: MK 2"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-5 slow"><i class="moon-dot moon-dark"></i></span><span class="planet-orb"></span></span><span>Makemake</span></button>
              <button class="mini-planet eris" type="button" data-planet="Eris" data-note="698" aria-label="Hear Eris say its name. Dysnomia is orbiting Eris." title="Dysnomia"><span class="planet-system" aria-hidden="true"><span class="moon-track orbit-5 slower"><i class="moon-dot moon-silver"></i></span><span class="planet-orb"></span></span><span>Eris</span></button>
          </div>
        </div>
      </section>

      <section class="pinball-zone" id="pinball" aria-labelledby="pinball-title">
        <div class="brick-playmat" aria-hidden="true">
          <span class="playmat-brick playmat-brick-one"></span>
          <span class="playmat-brick playmat-brick-two"></span>
          <span class="playmat-brick playmat-brick-three"></span>
          <span class="playmat-brick playmat-brick-four"></span>
        </div>
        <div class="pinball-copy">
          <h2 id="pinball-title">Brick<br /><span>ball.</span></h2>
          <div class="pinball-scoreboard" aria-live="polite">
            <p>SCORE <strong id="pinball-score">0000</strong></p>
            <p id="pinball-status">ready</p>
            <span class="pinball-goal-badge" aria-hidden="true">GOAL! +500</span>
          </div>
          <button class="pinball-reset" type="button" aria-label="Start a new game and change the goalie">&#8635; new game</button>
        </div>

        <div class="pinball-machine">
          <canvas id="pinball-canvas" width="480" height="640" aria-label="A small playable Brickball game"></canvas>
          <div class="pinball-controls" aria-label="Brickball controls">
            <button class="pinball-left" type="button" aria-label="Left flipper">&#9664; left</button>
            <button class="pinball-launch" type="button">launch</button>
            <button class="pinball-right" type="button" aria-label="Right flipper">right &#9654;</button>
          </div>
        </div>
      </section>

      <section class="card-zone" id="vincent-cards" aria-labelledby="card-zone-title">
        <div class="card-zone-pattern" aria-hidden="true">
          <span class="card-doodle card-doodle-bolt"></span>
          <span class="card-doodle card-doodle-leaf"></span>
          <span class="card-doodle card-doodle-star card-doodle-star-one"></span>
          <span class="card-doodle card-doodle-star card-doodle-star-two"></span>
          <span class="card-doodle card-doodle-spark"></span>
        </div>

        <header class="card-zone-heading">
          <div>
            <p class="card-kicker">pick a card</p>
            <h2 id="card-zone-title">Vincent's<br /><span>deck.</span></h2>
          </div>
          <div class="deck-controls">
            <p class="deck-status" aria-live="polite"><strong id="cards-showing">0</strong> / 9 showing</p>
            <button class="deck-shuffle" type="button">shuffle</button>
          </div>
        </header>

        <div class="card-deck is-dealing" role="group" aria-label="Nine cards that reveal fun facts about Vincent">
          <button class="fact-card card-electric" type="button" data-card-name="Pikachu" style="--deal-index: 0" aria-pressed="false" aria-label="Flip Pikachu card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Pikachu</strong><i aria-hidden="true">&#9889;</i></span>
                <span class="card-art"><img src="assets/pokemon/pikachu.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>electric</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 01</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>Vincent knows all five dwarf planets.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>

          <button class="fact-card card-grass" type="button" data-card-name="Bulbasaur" style="--deal-index: 1" aria-pressed="false" aria-label="Flip Bulbasaur card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Bulbasaur</strong><i aria-hidden="true">&#9752;</i></span>
                <span class="card-art"><img src="assets/pokemon/bulbasaur.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>grass</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 02</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>Expert LEGO BrickHeadz builder.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>

          <button class="fact-card card-fire" type="button" data-card-name="Charmander" style="--deal-index: 2" aria-pressed="false" aria-label="Flip Charmander card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Charmander</strong><i aria-hidden="true">&#9670;</i></span>
                <span class="card-art"><img src="assets/pokemon/charmander.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>fire</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 03</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>His favorite color is red.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>

          <button class="fact-card card-water" type="button" data-card-name="Squirtle" style="--deal-index: 3" aria-pressed="false" aria-label="Flip Squirtle card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Squirtle</strong><i aria-hidden="true">&#9679;</i></span>
                <span class="card-art"><img src="assets/pokemon/squirtle.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>water</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 04</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>He loves pinball and mini golf with Daddy.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>

          <button class="fact-card card-eevee" type="button" data-card-name="Eevee" style="--deal-index: 4" aria-pressed="false" aria-label="Flip Eevee card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Eevee</strong><i aria-hidden="true">&#10022;</i></span>
                <span class="card-art"><img src="assets/pokemon/eevee.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>normal</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 05</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>His favorite bike seat is right up front with Daddy.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>

          <button class="fact-card card-sleepy" type="button" data-card-name="Snorlax" style="--deal-index: 5" aria-pressed="false" aria-label="Flip Snorlax card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Snorlax</strong><i aria-hidden="true">Zz</i></span>
                <span class="card-art"><img src="assets/pokemon/snorlax.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>normal</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 06</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>Working on becoming an iron-powered snack champion.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>

          <button class="fact-card card-psyduck" type="button" data-card-name="Psyduck" style="--deal-index: 6" aria-pressed="false" aria-label="Flip Psyduck card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Psyduck</strong><i aria-hidden="true">?</i></span>
                <span class="card-art"><img src="assets/pokemon/psyduck.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>water</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 07</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>He reads comics—mostly the pictures. Words are next.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>

          <button class="fact-card card-ghost" type="button" data-card-name="Gengar" style="--deal-index: 7" aria-pressed="false" aria-label="Flip Gengar card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Gengar</strong><i aria-hidden="true">&#9789;</i></span>
                <span class="card-art"><img src="assets/pokemon/gengar.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>ghost</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 08</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>He can buckle his car-seat belt all by himself.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>

          <button class="fact-card card-fairy" type="button" data-card-name="Jigglypuff" style="--deal-index: 8" aria-pressed="false" aria-label="Flip Jigglypuff card to reveal a Vincent fact">
            <span class="card-flipper">
              <span class="card-face card-front">
                <span class="card-topline"><strong>Jigglypuff</strong><i aria-hidden="true">&#9834;</i></span>
                <span class="card-art"><img src="assets/pokemon/jigglypuff.png" alt="" loading="lazy" decoding="async" /></span>
                <span class="card-foot"><span>fairy</span><b aria-hidden="true">V&#9733;</b></span>
              </span>
              <span class="card-face card-back">
                <span class="fact-number">fact 09</span>
                <span class="fact-mark" aria-hidden="true">&#10022;</span>
                <strong>He knows several KPop Demon Hunters songs by heart.</strong>
                <span class="flip-back">tap to flip back</span>
              </span>
            </span>
          </button>
        </div>
      </section>
    </main>

    <footer><p>&copy; <span id="year"></span> THEVINCENTCHEUNG.COM</p></footer>
    <div class="toast" role="status" aria-live="polite"></div>

  </body>
</html>
